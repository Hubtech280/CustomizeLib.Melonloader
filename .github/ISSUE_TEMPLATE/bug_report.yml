name: Bug report
description: Report a problem with the CustomizeLib MelonLoader port
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: game-version
    attributes:
      label: PvZ Fusion version
      placeholder: "4.0.5.2"
    validations:
      required: true
  - type: input
    id: melonloader-version
    attributes:
      label: MelonLoader version
      placeholder: "0.7.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install...
        2. Launch...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: MelonLoader log
      description: Paste the complete log or attach Latest.log.
      render: text
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Installed mods
      description: List every mod using CustomizeLib and its version.
    validations:
      required: true
